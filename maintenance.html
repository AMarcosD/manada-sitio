<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manada — Ya volvemos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="forms.js"></script>
<style>
  body{ min-height: 100vh; display:flex; align-items:center; justify-content:center; }
  .soon{ max-width: 520px; text-align:center; padding: 40px 32px; }
  .soon .paw-big{ font-size: 40px; margin-bottom: 24px; }
  .soon h1{ font-size: 34px; margin-bottom: 16px; }
  .soon p{ color: var(--charcoal-soft); font-size: 16px; margin-bottom: 32px; }
  .soon .cta-form{ display:flex; gap: 10px; justify-content:center; flex-wrap: wrap; }
  .soon .cta-form .form-feedback{ width:100%; }
  .soon input{
    padding: 14px 18px; border-radius: 999px; border: 1.5px solid var(--line); min-width: 260px;
    font-family:'Inter',sans-serif; font-size: 14.5px;
    transition: border-color .15s var(--ease-out-expo), box-shadow .15s var(--ease-out-expo);
  }
  .soon input:focus{ outline:none; border-color: var(--terracotta); box-shadow: 0 0 0 4px rgba(224,113,75,0.15); }
</style>
</head>
<body>
  <div class="soon">
    <div class="paw-big">🐾</div>
    <span class="eyebrow">Muy pronto</span>
    <h1>Nos encontramos trabajando en esto.</h1>
    <p>Estamos armando Manada: una red que conecta empresas con refugios y hogares de tránsito en Argentina. Dejanos tu email y te avisamos apenas esté listo.</p>
    <form class="cta-form" data-lead-form="maintenance">
      <input type="email" name="email" placeholder="tu@email.com" required>
      <button type="submit" class="btn btn-primary">Avisarme</button>
    </form>
  </div>
</body>
</html>
